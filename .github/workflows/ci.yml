name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build all
        run: go build ./...

      - name: Test all
        run: go test ./...

  docker:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::7}
          echo "server_tags=ghcr.io/youko-nobody/harborx:latest,ghcr.io/youko-nobody/harborx:${SHA}" >> "$GITHUB_OUTPUT"
          echo "agent_tags=ghcr.io/youko-nobody/harborx-agent:latest,ghcr.io/youko-nobody/harborx-agent:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
          target: server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.agent_tags }}
          target: agent
          cache-from: type=gha
          cache-to: type=gha,mode=max